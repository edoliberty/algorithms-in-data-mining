name: Deploy Website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static assets
        run: |
          rm -rf website/algorithms-in-data-mining-2011 website/algorithms-in-data-mining-2012 website/algorithms-in-data-mining-2013
          cp -r algorithms-in-data-mining-2011 website/algorithms-in-data-mining-2011
          cp -r algorithms-in-data-mining-2012 website/algorithms-in-data-mining-2012
          cp -r algorithms-in-data-mining-2013 website/algorithms-in-data-mining-2013
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './website'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
